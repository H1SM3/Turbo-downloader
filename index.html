<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO DL | ГУСЕЙН EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Roboto', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .bg-glow { position: absolute; width: 400px; height: 400px; background: var(--primary); filter: blur(150px); border-radius: 50%; z-index: -1; opacity: 0.15; animation: move 8s infinite alternate; }
        @keyframes move { from { transform: translate(-30%, -30%); } to { transform: translate(30%, 30%); } }
        .container { background: #111; padding: 40px; border-radius: 30px; box-shadow: 0 0 40px rgba(0,0,0,0.8); text-align: center; width: 85%; max-width: 380px; border: 1px solid #222; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; margin-bottom: 25px; background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 2px solid #333; border-radius: 12px; color: white; font-size: 14px; outline: none; transition: 0.3s; box-sizing: border-box; margin-bottom: 20px; }
        input:focus { border-color: var(--primary); }
        .buttons { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-family: 'Orbitron', sans-serif; transition: 0.3s; text-transform: uppercase; font-size: 12px; }
        .btn-mp3 { background: var(--primary); color: #000; }
        .btn-mp4 { background: #222; color: #fff; border: 1px solid #444; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.2); }
        .status { margin-top: 20px; font-size: 0.8rem; color: #666; }
        .loader { display: none; width: 20px; height: 20px; border: 2px solid #333; border-top: 2px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <h1>TURBO DL</h1>
        <input type="text" id="vUrl" placeholder="Вставь ссылку сюда...">
        <div class="buttons">
            <button class="btn btn-mp3" onclick="dl('audio')">AUDIO</button>
            <button class="btn btn-mp4" onclick="dl('720')">VIDEO</button>
        </div>
        <div class="loader" id="ldr"></div>
        <div id="st" class="status">DESIGNED FOR GUSEIN</div>
    </div>

    <script>
        async function dl(mode) {
            const url = document.getElementById('vUrl').value;
            const st = document.getElementById('st');
            const ldr = document.getElementById('ldr');
            if(!url) return alert('Ссылку закинь!');

            st.innerText = "Взламываю систему...";
            ldr.style.display = "block";

            // Список серверов на случай сбоя
            const apis = ['https://api.cobalt.tools/api/json', 'https://cobalt.shizuku.io/api/json'];
            
            for(let api of apis) {
                try {
                    const res = await fetch(api, {
                        method: 'POST',
                        headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},
                        body: JSON.stringify({ url: url, downloadMode: (mode === 'audio' ? 'audio' : 'video'), videoQuality: mode })
                    });
                    const data = await res.json();
                    if(data.url) {
                        st.innerText = "✅ Нашел! Качаю...";
                        window.location.href = data.url;
                        ldr.style.display = "none";
                        return;
                    }
                } catch(e) { console.log("Сбой сервера, пробую другой..."); }
            }
            st.innerText = "❌ YouTube заблокировал доступ. Попробуй позже.";
            ldr.style.display = "none";
        }
    </script>
</body>
</html>
