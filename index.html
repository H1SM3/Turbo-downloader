<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO DL | GUSEIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .bg-glow { position: absolute; width: 400px; height: 400px; background: var(--primary); filter: blur(150px); border-radius: 50%; z-index: -1; opacity: 0.1; animation: move 10s infinite alternate; }
        @keyframes move { from { transform: translate(-20%, -20%); } to { transform: translate(20%, 20%); } }
        .card { background: #111; padding: 40px; border-radius: 30px; text-align: center; width: 85%; max-width: 360px; border: 1px solid #222; box-shadow: 0 0 40px rgba(0,242,254,0.1); }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--primary); font-size: 1.8rem; margin-bottom: 25px; letter-spacing: 2px; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: white; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: black; font-family: 'Orbitron', sans-serif; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0,242,254,0.4); }
        .status { font-size: 0.7rem; color: #444; margin-top: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .loader { display: none; width: 25px; height: 25px; border: 3px solid #222; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <h1>TURBO DL</h1>
        <input type="text" id="urlInput" placeholder="Вставь ссылку здесь...">
        <button class="btn" onclick="start()">СКАЧАТЬ</button>
        <div class="loader" id="loader"></div>
        <div id="msg" class="status">DESIGNED FOR GUSEIN</div>
    </div>

    <script>
        async function start() {
            const url = document.getElementById('urlInput').value;
            const msg = document.getElementById('msg');
            const loader = document.getElementById('loader');
            
            if(!url) return alert('Ссылку дай!');
            
            msg.innerText = "Обхожу защиту YouTube...";
            loader.style.display = "block";

            try {
                // Используем самый стабильный API с автоматическим проксированием
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        downloadMode: 'audio', // по умолчанию аудио, так как это чаще всего нужно
                        audioFormat: 'mp3'
                    })
                });

                const data = await response.json();

                if(data.url) {
                    msg.innerText = "Готово! Начинаю загрузку...";
                    window.location.href = data.url;
                } else {
                    // Если API не выдал ссылку, используем запасной «невидимый» редирект
                    msg.innerText = "Пробую запасной канал...";
                    let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
                    window.open(`https://www.y2mate.com/youtube/${id}`, '_blank');
                }
            } catch(e) {
                // Если всё упало, просто открываем проверенный загрузчик
                let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
                window.open(`https://www.y2mate.com/youtube/${id}`, '_blank');
            } finally {
                loader.style.display = "none";
                msg.innerText = "DESIGNED FOR GUSEIN";
            }
        }
    </script>
</body>
</html>
