<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO DL | GUSEIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Roboto', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .bg-glow { position: absolute; width: 450px; height: 450px; background: var(--primary); filter: blur(150px); border-radius: 50%; z-index: -1; opacity: 0.1; animation: move 10s infinite alternate; }
        @keyframes move { from { transform: translate(-25%, -25%); } to { transform: translate(25%, 25%); } }

        .container { background: #111; padding: 40px; border-radius: 30px; box-shadow: 0 0 50px rgba(0, 242, 254, 0.15); text-align: center; width: 85%; max-width: 380px; border: 1px solid #222; }
        
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; margin: 0 0 25px 0; background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 2px solid #333; border-radius: 12px; color: white; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 20px; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }

        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-family: 'Orbitron', sans-serif; transition: 0.3s; text-transform: uppercase; background: linear-gradient(45deg, #00f2fe, #4facfe); color: #000; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5); }
        .btn:active { transform: translateY(0); }

        .status { margin-top: 25px; font-size: 0.7rem; color: #444; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        <h1>TURBO DL</h1>
        <input type="text" id="videoUrl" placeholder="Вставь ссылку здесь...">
        <button class="btn" onclick="startDownload()">СКАЧАТЬ НАПРЯМУЮ</button>
        <div id="st" class="status">DESIGNED FOR GUSEIN</div>
    </div>

    <script>
        function startDownload() {
            const url = document.getElementById('videoUrl').value;
            const st = document.getElementById('st');
            if(!url) return alert('Ссылку закинь, бро!');

            st.innerText = "Подготовка файла...";
            
            try {
                let id = "";
                if (url.includes('v=')) id = url.split('v=')[1].split('&')[0];
                else if (url.includes('be/')) id = url.split('be/')[1].split('?')[0];
                else if (url.includes('shorts/')) id = url.split('shorts/')[1].split('?')[0];
                else id = url;

                if (id.length < 5) {
                    st.innerText = "Кривая ссылка!";
                    return;
                }

                // Используем самый стабильный метод через редирект для обхода банов
                const dlUrl = `https://www.y2mate.com/youtube/${id}`;
                window.open(dlUrl, '_blank');
                st.innerText = "Готово! Качай в новом окне.";
            } catch(e) {
                st.innerText = "Ошибка!";
            }
        }
    </script>
</body>
</html>
