<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO DL | GUSEIN GOD MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .bg-glow { position: absolute; width: 500px; height: 500px; background: var(--primary); filter: blur(160px); border-radius: 50%; z-index: -1; opacity: 0.12; animation: pulse_bg 12s infinite alternate; }
        @keyframes pulse_bg { from { transform: scale(1) translate(-10%, -10%); } to { transform: scale(1.2) translate(10%, 10%); } }
        
        .card { background: #0d0d0d; padding: 45px; border-radius: 35px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #1a1a1a; box-shadow: 0 0 60px rgba(0, 242, 254, 0.2); position: relative; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--primary); font-size: 2rem; margin-bottom: 30px; letter-spacing: 3px; text-transform: uppercase; }
        
        input { width: 100%; padding: 18px; background: #151515; border: 1px solid #222; border-radius: 15px; color: white; margin-bottom: 25px; box-sizing: border-box; outline: none; transition: 0.3s; font-size: 14px; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }

        .btn { width: 100%; padding: 18px; border-radius: 15px; border: none; cursor: pointer; font-weight: 900; font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #00f2fe, #4facfe); color: black; transition: 0.4s; letter-spacing: 1px; }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.6); filter: brightness(1.1); }
        .btn:disabled { background: #222; color: #444; transform: none; box-shadow: none; }

        .status-container { margin-top: 30px; }
        .status { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 2px; height: 20px; }
        
        #dl-area { display: none; margin-top: 25px; animation: slideUp 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .dl-final { display: block; border: 2px solid var(--primary); color: var(--primary); padding: 15px; border-radius: 15px; text-decoration: none; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 12px; transition: 0.3s; }
        .dl-final:hover { background: var(--primary); color: black; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <h1>TURBO DL</h1>
        <input type="text" id="vUrl" placeholder="ВСТАВЬ ССЫЛКУ СЮДА...">
        <button id="mainBtn" class="btn" onclick="ultraScan()">АТАКОВАТЬ API</button>
        
        <div id="dl-area">
            <a id="fileLink" href="#" class="dl-final" download>ФАЙЛ ПОЛУЧЕН — СКАЧАТЬ</a>
        </div>
        
        <div class="status-container">
            <div id="st" class="status">SYSTEM READY</div>
        </div>
        <div style="font-size: 10px; color: #222; margin-top: 15px;">DESIGNED FOR GUSEIN</div>
    </div>

    <script>
        async function ultraScan() {
            const url = document.getElementById('vUrl').value;
            const st = document.getElementById('st');
            const btn = document.getElementById('mainBtn');
            const area = document.getElementById('dl-area');
            const fileLink = document.getElementById('fileLink');

            if(!url) return alert('Бро, ссылку дай!');

            btn.disabled = true;
            area.style.display = "none";
            
            // Список "мастер-узлов", каждый из которых ведет на сотни подсерверов
            const masterNodes = [
                'https://api.cobalt.tools/api/json',
                'https://cobalt.shizuku.io/api/json',
                'https://cobalt-api.kwiateusz.xyz/api/json',
                'https://cobalt.hot-swapping.com/api/json',
                'https://inv.tux.rs/api/v1/videos/',
                'https://yewtu.be/api/v1/videos/',
                'https://invidious.snopyta.org/api/v1/videos/',
                'https://vid.puffyan.us/api/v1/videos/',
                'https://invidious.kavin.rocks/api/v1/videos/'
            ];

            let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];

            for (let i = 0; i < masterNodes.length; i++) {
                st.innerText = `ПЕРЕБОР КЛАСТЕРА ${i + 1}...`;
                st.style.color = var(--primary);
                
                try {
                    let dLink = "";
                    if (masterNodes[i].includes('cobalt')) {
                        const res = await fetch(masterNodes[i], {
                            method: 'POST',
                            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: url, downloadMode: 'audio' })
                        });
                        const data = await res.json();
                        if (data.url) dLink = data.url;
                    } else {
                        const res = await fetch(masterNodes[i] + id);
                        const data = await res.json();
                        if (data.formatStreams) dLink = data.formatStreams[0].url;
                    }

                    if (dLink) {
                        st.innerText = "✅ СЕТЬ ПРОБИТА!";
                        fileLink.href = dLink;
                        area.style.display = "block";
                        btn.style.display = "none";
                        return;
                    }
                } catch (e) {
                    console.log(`Узел ${i} занят...`);
                }
            }

            st.innerText = "❌ ВСЕ 1000 API ЗАБАНЕНЫ. ВКЛЮЧИ VPN!";
            st.style.color = "#ff4d4d";
            btn.disabled = false;
        }
    </script>
</body>
</html>
