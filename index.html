<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Downloader 🚀</title>
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f680.png">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.8); padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 20px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; color: white; width: 48%; }
        .mp3 { background: #4facfe; }
        .mp4 { background: #7c3aed; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Turbo DL 🚀</h1>
        <input id="urlInput" type="text" placeholder="Вставь ссылку на YouTube...">
        <div style="display: flex; justify-content: space-between;">
            <button class="btn mp3" onclick="download('mp3')">MP3</button>
            <button class="btn mp4" onclick="download('mp4')">MP4</button>
        </div>
    </div>

    <script>
        function download(format) {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert('Вставь ссылку!');
            // Теперь ссылка ведет прямо на твой сайт в папку api
            window.open(`/api/download?url=${encodeURIComponent(url)}&format=${format}`, '_blank');
        }
    </script>
</body>
</html>
