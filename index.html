<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Downloader 🚀</title>

    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f680.png">
    <meta property="og:title" content="Turbo Downloader 🚀">
    <meta property="og:description" content="Качай музыку и видео в один клик! Специально для Гусейна.">
    <meta property="og:image" content="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f680.png">
    <meta name="theme-color" content="#0f172a">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #7c3aed;
            --bg: #0f172a;
        }

        body {
            background: var(--bg);
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Анимированный фон */
        .circles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; }
        .circles li { position: absolute; list-style: none; display: block; background: rgba(255, 255, 255, 0.05); animation: animate 25s linear infinite; bottom: -150px; }
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        @keyframes animate { 0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; } 100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; } }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p { color: #94a3b8; margin-bottom: 30px; font-size: 0.9rem; }

        .input-group { position: relative; margin-bottom: 25px; }
        
        input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            border: 2px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

        .btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn {
            padding: 15px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mp3 { background: linear-gradient(45deg, #00f2fe, #4facfe); box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4); }
        .mp4 { background: linear-gradient(45deg, #7c3aed, #c084fc); box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }

        .btn:hover { transform: translateY(-5px) scale(1.02); filter: brightness(1.1); }
        .btn:active { transform: scale(0.95); }

        .footer { margin-top: 30px; font-size: 0.8rem; color: #475569; }
        .badge { background: #334155; padding: 5px 12px; border-radius: 20px; color: var(--primary); font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="card animate__animated animate__zoomIn">
        <div class="badge animate__animated animate__fadeInDown animate__delay-1s">v2.0 PRO</div>
        <h1>Turbo DL</h1>
        <p>Мгновенная загрузка музыки и видео</p>
        
        <div class="input-group">
            <input id="urlInput" type="text" placeholder="Вставь ссылку на YouTube...">
        </div>

        <div class="btn-container">
            <button class="btn mp3" onclick="download('mp3')">
                <i class="fas fa-music"></i> MP3
            </button>
            <button class="btn mp4" onclick="download('mp4')">
                <i class="fas fa-video"></i> MP4
            </button>
        </div>

        <div class="footer">
            Сделано для Гусейна 🚀
        </div>
    </div>

    <script>
        // Твоя ссылка на Render
        const BACKEND_URL = "https://turbo-downloader.onrender.com"; 

        function download(format) {
            const url = document.getElementById('urlInput').value;
            if(!url) {
                const input = document.getElementById('urlInput');
                input.classList.add('animate__animated', 'animate__shakeX');
                setTimeout(() => input.classList.remove('animate__animated', 'animate__shakeX'), 1000);
                return;
            }
            
            // Открываем загрузку
            window.open(`${BACKEND_URL}/download?url=${encodeURIComponent(url)}&format=${format}`, '_blank');
        }
    </script>
</body>
</html>
