<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO DL | Гусейн Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #050505;
            --card-bg: #111111;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Анимированный фон */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            margin-bottom: 25px;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

        .buttons { display: flex; gap: 15px; }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-mp3 { background: linear-gradient(45deg, #4facfe, #00f2fe); color: #000; }
        .btn-mp4 { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4); }
        .btn:active { transform: translateY(0); }

        .status { margin-top: 20px; font-size: 0.9rem; color: #888; min-height: 20px; }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <h1>TURBO DL</h1>
        <input type="text" id="videoUrl" placeholder="Вставь ссылку здесь...">
        
        <div class="buttons">
            <button class="btn btn-mp3" onclick="startDownload('mp3')">AUDIO</button>
            <button class="btn btn-mp4" onclick="startDownload('mp4')">VIDEO</button>
        </div>

        <div class="loader" id="loader"></div>
        <div class="status" id="status">Готов к взлету 🚀</div>
        
        <p style="margin-top: 30px; font-size: 0.7rem; color: #444; letter-spacing: 1px;">DESIGNED FOR GUSEIN</p>
    </div>

    <script>
        async function startDownload(type) {
            const url = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');
            const loader = document.getElementById('loader');

            if (!url) {
                status.innerText = "❌ Ссылку закинь, бро!";
                return;
            }

            status.innerText = "Связываюсь со спутником...";
            loader.style.display = "block";

            try {
                // Используем мощный публичный API Cobalt
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        downloadMode: type === 'mp3' ? 'audio' : 'video',
                        youtubeVideoQuality: '720',
                        audioFormat: 'mp3'
                    })
                });

                const data = await response.json();

                if (data.url) {
                    status.innerText = "✅ Нашел! Загружаю...";
                    window.location.href = data.url; // Прямое скачивание
                } else {
                    status.innerText = "❌ YouTube вредничает, попробуй позже";
                }
            } catch (error) {
                status.innerText = "❌ Ошибка связи. Попробуй еще раз.";
                console.error(error);
            } finally {
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
