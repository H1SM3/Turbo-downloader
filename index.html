<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO DL | GUSEIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .bg-glow { position: absolute; width: 450px; height: 450px; background: var(--primary); filter: blur(150px); border-radius: 50%; z-index: -1; opacity: 0.1; animation: move 10s infinite alternate; }
        @keyframes move { from { transform: translate(-25%, -25%); } to { transform: translate(25%, 25%); } }
        .card { background: #111; padding: 40px; border-radius: 30px; text-align: center; width: 85%; max-width: 360px; border: 1px solid #222; box-shadow: 0 0 50px rgba(0, 242, 254, 0.1); }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--primary); font-size: 1.8rem; margin-bottom: 25px; letter-spacing: 2px; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: white; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: black; font-family: 'Orbitron', sans-serif; text-transform: uppercase; }
        .status { font-size: 0.7rem; color: #444; margin-top: 25px; }
        .loader { display: none; width: 20px; height: 20px; border: 2px solid #222; border-top: 2px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <h1>TURBO DL</h1>
        <input type="text" id="vUrl" placeholder="Вставь ссылку здесь...">
        <button class="btn" onclick="downloadDirect()">СКАЧАТЬ</button>
        <div class="loader" id="ldr"></div>
        <div id="st" class="status">DESIGNED FOR GUSEIN</div>
    </div>

    <script>
        async function downloadDirect() {
            const url = document.getElementById('vUrl').value;
            const st = document.getElementById('st');
            const ldr = document.getElementById('ldr');
            if(!url) return alert('Ссылку закинь!');

            st.innerText = "Обхожу защиту...";
            ldr.style.display = "block";

            try {
                // Пытаемся получить прямую ссылку через Cobalt API
                const res = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, downloadMode: 'audio', audioFormat: 'mp3' })
                });

                const data = await res.json();

                if (data.url) {
                    st.innerText = "Начинаю загрузку...";
                    // Вместо открытия окна, тянем файл через скрытую ссылку
                    const link = document.createElement('a');
                    link.href = data.url;
                    link.setAttribute('download', 'music.mp3');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    st.innerText = "❌ YouTube заблокировал прямой доступ.";
                }
            } catch (e) {
                st.innerText = "❌ Ошибка связи с сервером.";
            } finally {
                ldr.style.display = "none";
            }
        }
    </script>
</body>
</html>
